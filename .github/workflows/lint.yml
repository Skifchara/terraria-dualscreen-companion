name: lint

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mod JavaScript syntax
        run: |
          for f in src/tlpro/Modified/1.mod/*.js; do
            echo "checking $f"
            node --input-type=module --check < "$f"
          done
      - name: JSON files
        run: |
          python -c "import json,sys; [json.load(open(p, encoding='utf-8')) for p in ['src/tlpro/Settings.json','src/tlpro/Modified/1.json']]"
      - name: Python tools compile
        run: python -m compileall -q tools
      - name: No game assets committed
        run: |
          if git ls-files | grep -E '\.(apk|obb|dll|so)$|dump\.cs|il2cpp\.h|global-metadata\.dat|assets-cache/|/atlas/'; then
            echo "game files or decoded assets must not be committed"; exit 1
          fi
      - name: Versions agree (manifest, TL Pro pack, changelog)
        run: python tools/release.py --check
      - name: Installer scripts compile
        run: python -m py_compile tools/install.py tools/release.py tools/make_installer_zip.py
      - name: Mod loads against the mock runtime
        run: node tests/mod_load.mjs
      - name: Text and message tables are complete
        run: python tests/test_strings.py
